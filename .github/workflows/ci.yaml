name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - name: Install helm-unittest
        run: helm plugin install --verify=false --version v1.1.2 https://github.com/helm-unittest/helm-unittest.git

      - name: Lint
        run: helm lint charts/

      - name: Unit tests
        run: helm unittest charts/

      - name: Get chart version
        if: github.event_name == 'push'
        id: chart
        run: |
          version=$(grep '^version:' charts/Chart.yaml | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        if: github.event_name == 'push'
        id: check
        run: |
          # A published chart version is never overwritten; bump Chart.yaml to release.
          # Publish only on a definite "not found"; any other lookup error fails the job.
          if out=$(helm show chart oci://ghcr.io/crabamole/charts/rustdesk --version "${{ steps.chart.outputs.version }}" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ': not found' <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Login to GHCR
        if: github.event_name == 'push' && steps.check.outputs.exists == 'false'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        if: github.event_name == 'push' && steps.check.outputs.exists == 'false'
        run: helm package charts/

      - name: Push to OCI registry
        if: github.event_name == 'push' && steps.check.outputs.exists == 'false'
        run: helm push rustdesk-${{ steps.chart.outputs.version }}.tgz oci://ghcr.io/crabamole/charts

      - name: Create git tag
        if: github.event_name == 'push' && steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.chart.outputs.version }}"
          git push origin "${{ steps.chart.outputs.version }}"
