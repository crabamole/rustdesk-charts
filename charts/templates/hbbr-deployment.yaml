apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbr") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "hbbr") | nindent 4 }}
spec:
  replicas: {{ .Values.hbbr.replicas }}
  selector:
    matchLabels:
      {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbr") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbr") | nindent 8 }}
        {{- with .Values.hbbr.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hbbr.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- with .Values.hbbr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hbbr
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.hbbr.image) }}
          imagePullPolicy: {{ .Values.hbbr.image.pullPolicy }}
          command: {{ .Values.hbbr.command | toJson }}
          {{- if .Values.hbbr.env }}
          env:
            {{- range $key, $value := .Values.hbbr.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.hbbr.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ws
              containerPort: 21119
              protocol: TCP
