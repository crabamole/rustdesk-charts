{{- include "rustdesk.validateDatabase" . }}
{{- if and (not .Values.postgresql.enabled) .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "database") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
{{- end }}
