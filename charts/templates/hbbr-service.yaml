apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hbbr
  labels:
    app.kubernetes.io/name: hbbr
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: hbbr
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: relay
      port: 21117
      targetPort: relay
      protocol: TCP
    - name: ws
      port: 21119
      targetPort: ws
      protocol: TCP
