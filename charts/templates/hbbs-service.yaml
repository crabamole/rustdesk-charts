apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hbbs
  labels:
    app.kubernetes.io/name: hbbs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: hbbs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: rendezvous
      port: 21116
      targetPort: rendezvous
      protocol: TCP
    - name: rendezvous-udp
      port: 21116
      targetPort: rendezvous-udp
      protocol: UDP
    - name: ws
      port: 21118
      targetPort: ws
      protocol: TCP
