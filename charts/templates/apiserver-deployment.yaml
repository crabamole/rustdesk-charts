apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "apiserver") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "apiserver") | nindent 4 }}
spec:
  replicas: {{ .Values.apiserver.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "rustdesk.selectorLabels" (dict "context" . "component" "apiserver") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustdesk.selectorLabels" (dict "context" . "component" "apiserver") | nindent 8 }}
        {{- with .Values.apiserver.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* oauth2.toml is read at startup (subPath mount); an existingSecret needs a manual restart. */}}
        {{- include "rustdesk.podAnnotations" (dict "context" . "component" "apiserver" "extra" (dict "checksum/oauth2" (include (print $.Template.BasePath "/hbbs-oauth2-configmap.yaml") . | sha256sum))) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rustdesk.serviceAccountName" . }}
      {{- include "rustdesk.imagePullSecrets" . | nindent 6 }}
      # No pod needs the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      # The api-server serves on after SIGTERM until requests stop (at most 25 s), then drains in-flight ones (15 s).
      terminationGracePeriodSeconds: 50
      {{- include "rustdesk.topologySpread" (dict "context" . "component" "apiserver") | nindent 6 }}
      {{- with .Values.apiserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apiserver
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.apiserver.image) }}
          imagePullPolicy: {{ .Values.apiserver.image.pullPolicy }}
          command: ["/app/rustdesk-api"]
          args:
            - "serve"
            - "--address"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.apiserver.port | default 21114 | quote }}
          workingDir: /data
          env:
            {{- include "rustdesk.databaseEnv" (dict "context" $ "var" "DATABASE_URL") | nindent 12 }}
            {{- if .Values.extraCACerts }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/extra/ca-bundle.crt"
            {{- end }}
            - name: TRUSTED_PROXIES
              value: {{ join "," .Values.trustedProxies | quote }}
            - name: DEVICE_ADMISSION
              value: {{ ternary "Y" "N" .Values.deviceAdmission.enabled | quote }}
            {{- with .Values.deviceAdmission.webhook.url }}
            - name: ADMISSION_WEBHOOK_URL
              value: {{ . | quote }}
            - name: ADMISSION_WEBHOOK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.deviceAdmission.webhook.keySecret }}
                  key: id_ed25519
            {{- end }}
            - name: PUBLIC_URL
              value: {{ include "rustdesk.publicUrl" . | quote }}
            {{- range $key, $value := .Values.apiserver.env }}
            {{- if and $value (ne $key "PUBLIC_URL") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.apiserver.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: api
              containerPort: {{ .Values.apiserver.port | default 21114 }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: api
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if include "rustdesk.oauth2Enabled" . }}
            - name: oauth2
              mountPath: /data/oauth2.toml
              subPath: oauth2.toml
              readOnly: true
            {{- end }}
            {{- if .Values.extraCACerts }}
            - name: extra-ca-certs
              mountPath: /etc/ssl/certs/extra
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        {{- if include "rustdesk.oauth2Enabled" . }}
        - name: oauth2
          secret:
            secretName: {{ include "rustdesk.oauth2SecretName" . }}
        {{- end }}
        {{- if .Values.extraCACerts }}
        - name: extra-ca-certs
          configMap:
            name: {{ include "rustdesk.fullname" . }}-extra-ca-certs
        {{- end }}
