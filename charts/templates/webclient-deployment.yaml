apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "webclient") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "webclient") | nindent 4 }}
spec:
  replicas: {{ .Values.webclient.replicas }}
  selector:
    matchLabels:
      {{- include "rustdesk.selectorLabels" (dict "context" . "component" "webclient") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustdesk.selectorLabels" (dict "context" . "component" "webclient") | nindent 8 }}
        {{- with .Values.webclient.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/webclient-configmap.yaml") . | sha256sum }}
        {{- with .Values.webclient.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.webclient.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webclient.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webclient.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "rustdesk.componentName" (dict "context" . "component" "webclient") }}
        - name: tmp
          emptyDir: {}
      containers:
        - name: webclient
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.webclient.image) }}
          imagePullPolicy: {{ .Values.webclient.image.pullPolicy }}
          {{- $hasEnv := false }}
          {{- range $value := .Values.webclient.env }}{{ if $value }}{{ $hasEnv = true }}{{ end }}{{ end }}
          {{- if $hasEnv }}
          env:
            {{- range $key, $value := .Values.webclient.env }}
            {{- if $value }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tmp
              mountPath: /tmp
          {{- with .Values.webclient.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
