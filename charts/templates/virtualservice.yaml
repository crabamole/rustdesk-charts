{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "rustdesk.fullname" . }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "hbbs") | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.istio.hosts | nindent 4 }}
  gateways:
    - {{ .Values.istio.gateway }}
  http:
    - match:
        - uri:
            prefix: /ws/id
      route:
        - destination:
            host: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbs") }}
            port:
              number: 21118
    - match:
        - uri:
            prefix: /ws/relay
      route:
        - destination:
            host: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbr") }}
            port:
              number: 21119
    - match:
        - uri:
            prefix: /api/
      directResponse:
        status: 200
        body:
          string: "{}"
    - route:
        - destination:
            host: {{ include "rustdesk.componentName" (dict "context" . "component" "webclient") }}
            port:
              number: 80
{{- end }}
