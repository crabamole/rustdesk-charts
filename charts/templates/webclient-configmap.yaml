apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "webclient") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "webclient") | nindent 4 }}
data:
  nginx.conf: |
    user  nginx;
    worker_processes  1;

    error_log  /var/log/nginx/error.log notice;
    pid        /run/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        keepalive_timeout  65;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 80 default_server;

            location / {
                root /usr/share/nginx/html;
                index index.html;
                add_header Cache-Control "no-cache, must-revalidate";
            }

            location /ws/id {
                proxy_pass http://{{ include "rustdesk.componentName" (dict "context" . "component" "hbbs") }}:21118;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 300s;
            }

            location /ws/relay {
                proxy_pass http://{{ include "rustdesk.componentName" (dict "context" . "component" "hbbr") }}:21119;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 300s;
            }

            location /api/ {
                default_type application/json;
                return 200 '{}';
            }
        }
    }
