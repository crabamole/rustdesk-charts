apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "webclient") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "webclient") | nindent 4 }}
data:
  nginx.conf: |
    # Runs as the unprivileged nginx user: port 8080, writable files under /tmp.
    worker_processes  1;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        sendfile        on;
        keepalive_timeout  65;

        server {
            # Unprivileged: the image's own config listens on 80.
            listen 8080;

            location / {
                root /usr/share/nginx/html;
                index index.html;
                add_header Cache-Control "no-cache, must-revalidate";
                # Only our own pages may frame the web client (clickjacking).
                add_header X-Frame-Options SAMEORIGIN;
                add_header X-Content-Type-Options nosniff;
            }
        }
    }
