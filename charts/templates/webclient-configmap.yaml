apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "webclient") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "webclient") | nindent 4 }}
data:
  nginx.conf: |
    # Runs as the unprivileged nginx user: port 8080, writable files under /tmp.
    worker_processes  1;
    # Each proxied WebSocket holds two connections (client and upstream).
    worker_rlimit_nofile  {{ mul 2 (int .Values.webclient.nginx.workerConnections) }};

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  {{ int .Values.webclient.nginx.workerConnections }};
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        sendfile        on;
        keepalive_timeout  65;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        map $http_x_forwarded_proto $forwarded_proto {
            default $http_x_forwarded_proto;
            ''      $scheme;
        }

        server {
            listen 8080 default_server;
            {{- range .Values.realIp.trustedProxies }}
            set_real_ip_from {{ . }};
            {{- end }}
            {{- if .Values.realIp.trustedProxies }}
            real_ip_header {{ .Values.realIp.header }};
            real_ip_recursive on;
            {{- end }}

            location / {
                root /usr/share/nginx/html;
                index index.html;
                add_header Cache-Control "no-cache, must-revalidate";
            }

            location /ws/id {
                proxy_pass http://{{ include "rustdesk.componentName" (dict "context" . "component" "hbbs") }}:21118;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_read_timeout 300s;
            }

            # hbbs hands out one URL per hbbr pod; both halves of a session must reach that pod.
            {{- $hbbr := include "rustdesk.componentName" (dict "context" . "component" "hbbr") }}
            {{- range $i := until (int .Values.hbbr.replicas) }}
            location = /ws/relay/{{ $i }} {
                proxy_pass http://{{ $hbbr }}-{{ $i }}:21119;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_read_timeout 300s;
            }
            {{- end }}

            location /ws/relay {
                proxy_pass http://{{ include "rustdesk.componentName" (dict "context" . "component" "hbbr") }}:21119;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_read_timeout 300s;
            }

            {{- $apiHost := printf "%s:21114" (include "rustdesk.componentName" (dict "context" . "component" "apiserver")) }}
            location /api/ {
                proxy_pass http://{{ $apiHost }};
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header X-Forwarded-Proto $forwarded_proto;
            }

            location /ui {
                proxy_pass http://{{ $apiHost }};
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header X-Forwarded-Proto $forwarded_proto;
            }
        }
    }
