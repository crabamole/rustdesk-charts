apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbs") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "hbbs") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbs") | nindent 8 }}
        {{- with .Values.hbbs.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hbbs.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- with .Values.hbbs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hbbs
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.hbbs.image) }}
          imagePullPolicy: {{ .Values.hbbs.image.pullPolicy }}
          command: {{ .Values.hbbs.command | toJson }}
          workingDir: /data
          {{- if .Values.hbbs.relayAddress }}
          args:
            - "-r"
            - {{ .Values.hbbs.relayAddress | quote }}
          {{- end }}
          {{- if or .Values.hbbs.oauth2 .Values.hbbs.env (and .Values.apiserver .Values.apiserver.enabled) }}
          env:
            {{- if .Values.hbbs.oauth2 }}
            - name: OAUTH2_CONFIG_FILE
              value: /data/oauth2.toml
            {{- end }}
            {{- if and .Values.apiserver .Values.apiserver.enabled }}
            - name: API_SERVER
              value: "http://127.0.0.1:{{ .Values.apiserver.port | default 21114 }}"
            {{- end }}
            {{- range $key, $value := .Values.hbbs.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.hbbs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ws
              containerPort: 21118
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keypair
              mountPath: /data/id_ed25519
              subPath: {{ .Values.keypair.privateKeyKey }}
              readOnly: true
            - name: keypair
              mountPath: /data/id_ed25519.pub
              subPath: {{ .Values.keypair.publicKeyKey }}
              readOnly: true
            {{- if .Values.hbbs.oauth2 }}
            - name: oauth2
              mountPath: /data/oauth2.toml
              subPath: oauth2.toml
              readOnly: true
            {{- end }}
        {{- if and .Values.apiserver .Values.apiserver.enabled }}
        - name: apiserver
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.apiserver.image) }}
          imagePullPolicy: {{ .Values.apiserver.image.pullPolicy }}
          command: ["/app/sctgdesk-api-server"]
          args:
            - "--address"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.apiserver.port | default 21114 | quote }}
          workingDir: /data
          {{- if .Values.apiserver.env }}
          env:
            {{- range $key, $value := .Values.apiserver.env }}
            {{- if $value }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.apiserver.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: api
              containerPort: {{ .Values.apiserver.port | default 21114 }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.hbbs.oauth2 }}
            - name: oauth2
              mountPath: /data/oauth2.toml
              subPath: oauth2.toml
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: keypair
          secret:
            secretName: {{ .Values.keypair.secretName }}
        {{- if .Values.hbbs.oauth2 }}
        - name: oauth2
          configMap:
            name: {{ .Release.Name }}-hbbs-oauth2
        {{- end }}
        - name: data
          {{- if .Values.hbbs.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbs") }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
