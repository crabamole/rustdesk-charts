apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hbbs
  labels:
    app.kubernetes.io/name: hbbs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hbbs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hbbs
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.hbbs.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hbbs.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- with .Values.hbbs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hbbs
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.hbbs.image) }}
          imagePullPolicy: {{ .Values.hbbs.image.pullPolicy }}
          command: {{ .Values.hbbs.command | toJson }}
          {{- if .Values.hbbs.relayAddress }}
          args:
            - "-r"
            - {{ .Values.hbbs.relayAddress | quote }}
          {{- end }}
          env:
            {{- range $key, $value := .Values.hbbs.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.hbbs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: rendezvous
              containerPort: 21116
              protocol: TCP
            - name: rendezvous-udp
              containerPort: 21116
              protocol: UDP
            - name: ws
              containerPort: 21118
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keypair
              mountPath: /data/id_ed25519
              subPath: {{ .Values.keypair.privateKeyKey }}
              readOnly: true
            - name: keypair
              mountPath: /data/id_ed25519.pub
              subPath: {{ .Values.keypair.publicKeyKey }}
              readOnly: true
      volumes:
        - name: keypair
          secret:
            secretName: {{ .Values.keypair.secretName }}
        - name: data
          {{- if .Values.hbbs.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-hbbs-data
          {{- else }}
          emptyDir: {}
          {{- end }}
