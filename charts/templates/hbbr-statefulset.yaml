apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbr") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "hbbr") | nindent 4 }}
spec:
  replicas: {{ .Values.hbbr.replicas }}
  serviceName: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbr") }}-hl
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbr") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbr") | nindent 8 }}
        {{- with .Values.hbbr.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hbbr.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rustdesk.serviceAccountName" . }}
      {{- include "rustdesk.imagePullSecrets" . | nindent 6 }}
      # No pod needs the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      # A stopping pod keeps relaying its running sessions until they end or this runs out.
      terminationGracePeriodSeconds: {{ .Values.hbbr.terminationGracePeriodSeconds }}
      {{- include "rustdesk.topologySpread" (dict "context" . "component" "hbbr") | nindent 6 }}
      {{- with .Values.hbbr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hbbr
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.hbbr.image) }}
          imagePullPolicy: {{ .Values.hbbr.image.pullPolicy }}
          command: {{ .Values.hbbr.command | toJson }}
          workingDir: /data
          env:
            {{- /* runs as uid 1000, which has no home; HOME=/ is read-only */}}
            - name: HOME
              value: /data
            - name: HEALTH_PORT
              value: "21122"
            {{- range $key, $value := .Values.hbbr.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.hbbr.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ws
              containerPort: 21119
              protocol: TCP
            - name: health
              containerPort: 21122
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
