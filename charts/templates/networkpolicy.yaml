{{- if .Values.networkPolicy.enabled }}
{{- /* Ingress only: each component accepts traffic just from the components that call it.
       Outside traffic enters through the Istio gateway's pods (istio.gatewayPods). */}}
{{- include "rustdesk.networkPolicy" (dict "context" . "component" "webclient" "port" "http" "from" (list "gateway")) }}
---
{{- /* hbbs pods forward session setup to each other and poll each hbbr pod's /readyz.
       Kubelet probes come from the pod's own node, which NetworkPolicy does not block. */}}
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "hbbs" "port" "ws" "from" (list "gateway") "extra" (list (dict "port" "internal" "from" (list "hbbs")))) }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "hbbr" "port" "ws" "from" (list "gateway") "extra" (list (dict "port" "health" "from" (list "hbbs")))) }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "apiserver" "port" "api" "from" (list "gateway" "hbbs")) }}
{{- if .Values.postgresql.enabled }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "postgresql" "port" "postgres" "from" (list "hbbs" "apiserver")) }}
{{- end }}
{{- if .Values.oidcMock.enabled }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "oidc-mock" "port" "http") }}
{{- end }}
{{- end }}
