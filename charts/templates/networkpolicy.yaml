{{- if .Values.networkPolicy.enabled }}
{{- /* Ingress only: each component accepts traffic just from the components that call it.
       Outside traffic enters through the web client, which proxies to hbbs, hbbr and the api-server. */}}
{{- include "rustdesk.networkPolicy" (dict "context" . "component" "webclient" "port" "http") }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "hbbs" "port" "ws" "from" (list "webclient")) }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "hbbr" "port" "ws" "from" (list "webclient")) }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "apiserver" "port" "api" "from" (list "webclient" "hbbs")) }}
{{- if .Values.postgresql.enabled }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "postgresql" "port" "postgres" "from" (list "hbbs" "apiserver")) }}
{{- end }}
{{- if .Values.oidcMock.enabled }}
---
{{ include "rustdesk.networkPolicy" (dict "context" . "component" "oidc-mock" "port" "http") }}
{{- end }}
{{- end }}
