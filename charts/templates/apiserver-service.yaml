{{- if .Values.apiserver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "apiserver") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "apiserver") | nindent 4 }}
spec:
  selector:
    {{- include "rustdesk.selectorLabels" (dict "context" . "component" "apiserver") | nindent 4 }}
  ports:
    - name: http
      port: 21114
      targetPort: http
      protocol: TCP
{{- end }}
