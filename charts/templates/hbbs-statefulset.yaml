apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbs") }}
  labels:
    {{- include "rustdesk.labels" (dict "context" . "component" "hbbs") | nindent 4 }}
spec:
  replicas: {{ .Values.hbbs.replicas }}
  serviceName: {{ include "rustdesk.componentName" (dict "context" . "component" "hbbs") }}-hl
  podManagementPolicy: OrderedReady
  minReadySeconds: {{ .Values.hbbs.minReadySeconds }}
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rustdesk.selectorLabels" (dict "context" . "component" "hbbs") | nindent 8 }}
        {{- with .Values.hbbs.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hbbs.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rustdesk.serviceAccountName" . }}
      {{- include "rustdesk.imagePullSecrets" . | nindent 6 }}
      # No pod needs the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      {{- include "rustdesk.topologySpread" (dict "context" . "component" "hbbs") | nindent 6 }}
      {{- with .Values.hbbs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hbbs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hbbs
          image: {{ include "rustdesk.image" (dict "global" .Values.global "image" .Values.hbbs.image) }}
          imagePullPolicy: {{ .Values.hbbs.image.pullPolicy }}
          command: {{ .Values.hbbs.command | toJson }}
          workingDir: /data
          {{- /* runs as uid 1000, which has no home; HOME=/ is read-only */}}
          {{- $hbbsEnv := list (dict "name" "HOME" "value" "/data") }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" "API_SERVER" "value" (printf "http://%s:21114" (include "rustdesk.componentName" (dict "context" . "component" "apiserver")))) }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" "POD_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.name"))) }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" "POD_IP" "valueFrom" (dict "fieldRef" (dict "fieldPath" "status.podIP"))) }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" "INTERNAL_PORT" "value" "21120") }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" "HEALTH_PORT" "value" "21121") }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" "RELAY_URLS" "value" (include "rustdesk.relayUrls" .)) }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" "RELAY_CHECKS" "value" (include "rustdesk.relayChecks" .)) }}
            {{- range $key, $value := .Values.hbbs.env }}
            {{- if ne $key "HEALTH_PORT" }}
            {{- $hbbsEnv = append $hbbsEnv (dict "name" $key "value" ($value | toString)) }}
            {{- end }}
            {{- end }}
          env:
            {{- include "rustdesk.databaseEnv" (dict "context" $ "var" "DB_URL") | nindent 12 }}
            {{- range $hbbsEnv }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- with .Values.hbbs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ws
              containerPort: 21118
              protocol: TCP
            - name: internal
              containerPort: 21120
              protocol: TCP
            - name: health
              containerPort: 21121
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Devices hbbs disconnects on SIGTERM must reconnect to another pod.
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: keypair
              mountPath: /data/id_ed25519
              subPath: {{ .Values.keypair.privateKeyKey }}
              readOnly: true
            - name: keypair
              mountPath: /data/id_ed25519.pub
              subPath: {{ .Values.keypair.publicKeyKey }}
              readOnly: true
      volumes:
        - name: keypair
          secret:
            secretName: {{ .Values.keypair.secretName }}
        - name: data
          emptyDir: {}
