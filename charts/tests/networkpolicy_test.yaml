suite: network policies
templates:
  - templates/networkpolicy.yaml
set:
  istio.gateway: istio-ingress/corp
  trustedProxies: ["10.244.0.0/16"]
  oidcMock.authorizeUrl: https://oidc.example.com
tests:
  - it: renders one ingress-only policy per component
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: spec.policyTypes
          value: [Ingress]

  - it: admits only the gateway pods to the web client
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-rustdesk-webclient
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports: [{ port: http }]
              from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-system } }, podSelector: { matchLabels: { istio: ingressgateway } } }]

  - it: lets only hbbs and the api-server reach Postgres
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-rustdesk-postgresql
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: hbbs
                app.kubernetes.io/instance: RELEASE-NAME
      - lengthEqual:
          path: spec.ingress[0].from
          count: 2
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: apiserver
                app.kubernetes.io/instance: RELEASE-NAME

  - it: lets the gateway pods and hbbs reach the api-server
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-rustdesk-apiserver
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports: [{ port: api }]
              from:
                - { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-system } }, podSelector: { matchLabels: { istio: ingressgateway } } }
                - { podSelector: { matchLabels: { app.kubernetes.io/name: hbbs, app.kubernetes.io/instance: RELEASE-NAME } } }

  - it: lets the gateway pods reach hbbs and hbbs pods reach each other's internal port
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-rustdesk-hbbs
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports: [{ port: ws }]
              from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-system } }, podSelector: { matchLabels: { istio: ingressgateway } } }]
            - ports: [{ port: internal }]
              from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: hbbs, app.kubernetes.io/instance: RELEASE-NAME } } }]

  - it: lets the gateway pods reach hbbr and hbbs poll hbbr's health port
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-rustdesk-hbbr
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports: [{ port: ws }]
              from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-system } }, podSelector: { matchLabels: { istio: ingressgateway } } }]
            - ports: [{ port: health }]
              from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: hbbs, app.kubernetes.io/instance: RELEASE-NAME } } }]

  - it: selects custom gateway pods
    set:
      istio.gatewayPods:
        namespace: edge
        labels: { istio: custom, tier: ingress }
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-rustdesk-webclient
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: edge } }
              podSelector: { matchLabels: { istio: custom, tier: ingress } }

  - it: omits Postgres and mock policies when those are not deployed
    set:
      postgresql.enabled: false
      database.url: postgres://u:p@db:5432/rustdesk
      oidcMock.enabled: false
      hbbs.oauth2.existingSecret: corp-oidc
    asserts:
      - hasDocuments:
          count: 4

  - it: can be disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
