suite: apiserver
templates:
  - templates/apiserver-service.yaml
tests:
  - it: renders service when enabled
    set:
      apiserver:
        enabled: true
        image:
          registry: ghcr.io
          repository: rophy/sctgdesk-api-server
          tag: "dev"
          pullPolicy: IfNotPresent
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 21114
      - equal:
          path: spec.ports[0].targetPort
          value: api

  - it: selects hbbs pods
    set:
      apiserver:
        enabled: true
        image:
          registry: ghcr.io
          repository: rophy/sctgdesk-api-server
          tag: "dev"
          pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: hbbs

  - it: does not render service when disabled
    asserts:
      - hasDocuments:
          count: 0
