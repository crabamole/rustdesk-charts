suite: virtualservice
templates:
  - templates/virtualservice.yaml
tests:
  - it: is not rendered when istio is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when istio is enabled
    set:
      istio.enabled: true
      istio.hosts:
        - rustdesk.example.com
      istio.gateway: istio-system/default-gateway
    asserts:
      - isKind:
          of: VirtualService
      - equal:
          path: spec.hosts[0]
          value: rustdesk.example.com
      - equal:
          path: spec.gateways[0]
          value: istio-system/default-gateway

  - it: renders multiple hosts
    set:
      istio.enabled: true
      istio.hosts:
        - rustdesk.example.com
        - rustdesk.example.localhost
    asserts:
      - equal:
          path: spec.hosts[0]
          value: rustdesk.example.com
      - equal:
          path: spec.hosts[1]
          value: rustdesk.example.localhost

  - it: renders standard labels
    set:
      istio.enabled: true
    asserts:
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: uses fullname for metadata name
    set:
      istio.enabled: true
      fullnameOverride: myrd
    asserts:
      - equal:
          path: metadata.name
          value: myrd

  - it: routes /ws/id to hbbs
    set:
      istio.enabled: true
    asserts:
      - equal:
          path: spec.http[0].match[0].uri.prefix
          value: /ws/id
      - equal:
          path: spec.http[0].route[0].destination.host
          value: RELEASE-NAME-rustdesk-hbbs
      - equal:
          path: spec.http[0].route[0].destination.port.number
          value: 21118

  - it: routes /ws/relay to hbbr
    set:
      istio.enabled: true
    asserts:
      - equal:
          path: spec.http[1].match[0].uri.prefix
          value: /ws/relay
      - equal:
          path: spec.http[1].route[0].destination.host
          value: RELEASE-NAME-rustdesk-hbbr
      - equal:
          path: spec.http[1].route[0].destination.port.number
          value: 21119

  - it: routes /api/ to webclient
    set:
      istio.enabled: true
    asserts:
      - equal:
          path: spec.http[2].match[0].uri.prefix
          value: /api/
      - equal:
          path: spec.http[2].route[0].destination.host
          value: RELEASE-NAME-rustdesk-webclient
      - equal:
          path: spec.http[2].route[0].destination.port.number
          value: 80

  - it: routes default traffic to webclient
    set:
      istio.enabled: true
    asserts:
      - equal:
          path: spec.http[3].route[0].destination.host
          value: RELEASE-NAME-rustdesk-webclient
      - equal:
          path: spec.http[3].route[0].destination.port.number
          value: 80

  - it: uses fullnameOverride in route destinations
    set:
      istio.enabled: true
      fullnameOverride: myrd
    asserts:
      - equal:
          path: spec.http[0].route[0].destination.host
          value: myrd-hbbs
      - equal:
          path: spec.http[1].route[0].destination.host
          value: myrd-hbbr
      - equal:
          path: spec.http[2].route[0].destination.host
          value: myrd-webclient
      - equal:
          path: spec.http[3].route[0].destination.host
          value: myrd-webclient
