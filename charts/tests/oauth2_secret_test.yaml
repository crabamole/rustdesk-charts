suite: oauth2 provider Secret for the OIDC mock
templates:
  - hbbs-oauth2-configmap.yaml
tests:
  - it: sets the issuer to the mock's URL so ID tokens validate
    set:
      oidcMock.enabled: true
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - matchRegex:
          path: stringData["oauth2.toml"]
          pattern: '(?m)^issuer = "https://oidc\.example\.com"$'
  - it: labels the login button "OIDC"
    set:
      oidcMock.enabled: true
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - matchRegex:
          path: stringData["oauth2.toml"]
          pattern: '(?m)^op = "OIDC"$'
      - matchRegex:
          path: stringData["oauth2.toml"]
          pattern: '(?m)^op_auth_string = "oidc/OIDC"$'
  - it: is not rendered with an existing Secret
    set:
      oidcMock.enabled: true
      oidcMock.authorizeUrl: https://oidc.example.com
      hbbs.oauth2.existingSecret: corp-oidc
    asserts:
      - hasDocuments:
          count: 0
