suite: hbbs statefulset
templates:
  - templates/hbbs-statefulset.yaml
set:
  publicHost: rustdesk.example.com
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-hbbs
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-rustdesk-hbbs-hl
      - equal:
          path: spec.podManagementPolicy
          value: OrderedReady
      - equal:
          path: spec.updateStrategy
          value:
            type: RollingUpdate
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: waits 20 s per pod during rolling updates by default
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 20

  - it: allows overriding minReadySeconds
    set:
      hbbs.minReadySeconds: 0
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 0

  - it: rejects a negative minReadySeconds
    set:
      hbbs.minReadySeconds: -1
    asserts:
      - failedTemplate: {}

  - it: requires login to start connections by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOGGED_IN_ONLY
            value: "Y"

  - it: allows turning login-only off
    set:
      hbbs.env.LOGGED_IN_ONLY: "N"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOGGED_IN_ONLY
            value: "N"

  - it: renders standard labels
    asserts:
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "1.4.9"

  - it: respects fullnameOverride
    set:
      fullnameOverride: myrd
    asserts:
      - equal:
          path: metadata.name
          value: myrd-hbbs

  - it: sets the default image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/crabamole/rustdesk-server:1.1.16-4

  - it: uses global image registry override
    set:
      global.imageRegistry: registry.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/crabamole/rustdesk-server:1.1.16-4

  - it: scales with hbbs.replicas
    set:
      hbbs.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: passes no -r flag (RELAY_URLS replaces it)
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].args

  - it: hands out one relay URL per hbbr pod and polls each pod's readiness
    set:
      hbbr.replicas: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELAY_URLS
            value: wss://rustdesk.example.com/ws/relay/0,wss://rustdesk.example.com/ws/relay/1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELAY_CHECKS
            value: http://RELEASE-NAME-rustdesk-hbbr-0:21122/readyz,http://RELEASE-NAME-rustdesk-hbbr-1:21122/readyz

  - it: keeps the port of publicHost in the relay URLs
    set:
      publicHost: rustdesk.example.com:8443
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELAY_URLS
            value: wss://rustdesk.example.com:8443/ws/relay/0

  - it: uses ws:// when PUBLIC_URL is plain http
    set:
      apiserver.env.PUBLIC_URL: http://rustdesk.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELAY_URLS
            value: ws://rustdesk.example.com/ws/relay/0

  - it: tells hbbs its pod name, pod IP and ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTERNAL_PORT
            value: "21120"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PORT
            value: "21121"

  - it: spreads pods over nodes without blocking scheduling
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hbbs
                  app.kubernetes.io/instance: RELEASE-NAME

  - it: renders environment variables
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALWAYS_USE_RELAY
            value: "Y"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: info

  - it: sets HOME to the writable data dir (uid 1000 has no home; HOME=/ is read-only)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /data

  - it: always sets env from the database helper and API_SERVER even when hbbs.env is empty
    set:
      hbbs.env: null
      oidcMock:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_URL
            value: postgres://rustdesk:$(DATABASE_PASSWORD)@RELEASE-NAME-rustdesk-postgresql:5432/rustdesk
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_SERVER
            value: http://RELEASE-NAME-rustdesk-apiserver:21114

  - it: renders default resource limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi

  - it: renders custom resources
    set:
      hbbs.resources:
        limits:
          cpu: "2"
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: renders container ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ws
            containerPort: 21118
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: internal
            containerPort: 21120
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            containerPort: 21121
            protocol: TCP
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 3

  - it: mounts keypair and data volumes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: keypair
            mountPath: /data/id_ed25519
            subPath: id_ed25519
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: sets container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: "ALL"
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: renders nodeSelector
    set:
      hbbs.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: omits nodeSelector when empty
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector

  - it: renders affinity
    set:
      hbbs.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - us-east-1a
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity.nodeAffinity

  - it: renders tolerations
    set:
      hbbs.tolerations:
        - key: dedicated
          operator: Equal
          value: rustdesk
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: rustdesk
            effect: NoSchedule

  - it: renders pod annotations
    set:
      hbbs.podAnnotations:
        test-annotation: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations.test-annotation
          value: "true"

  - it: omits annotations when empty
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  - it: renders pod labels
    set:
      hbbs.podLabels:
        team: infra
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: infra

  - it: gets no OIDC provider config (only the api-server reads it)
    set:
      oidcMock.enabled: false
      hbbs.oauth2.existingSecret: my-custom-oauth2
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH2_CONFIG_FILE
            value: /data/oauth2.toml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: oauth2
            secret:
              secretName: my-custom-oauth2

  - it: omits oauth2 volume when oidcMock disabled and no existingSecret
    set:
      oidcMock:
        enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: oauth2
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: oauth2
          any: true

  - it: restarts on /livez and leaves the Service on /readyz
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2

  - it: has exactly one container and no PVC
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: gets DB_URL from the shared database helper and API_SERVER from the service
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_URL
            value: postgres://rustdesk:$(DATABASE_PASSWORD)@RELEASE-NAME-rustdesk-postgresql:5432/rustdesk
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_SERVER
            value: http://RELEASE-NAME-rustdesk-apiserver:21114

  - it: waits before draining so the Service drops the pod first
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value: ["sleep", "5"]

  - it: ignores a user HEALTH_PORT so the probes keep working
    set:
      hbbs.env:
        HEALTH_PORT: "9999"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PORT
            value: "21121"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PORT
            value: "9999"

  - it: waits up to 5 minutes for /livez at startup
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
