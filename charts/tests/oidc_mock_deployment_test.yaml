suite: oidc-mock deployment
set:
  istio.gateway: istio-ingress/corp
  trustedProxies: ["10.244.0.0/16"]
  oidcMock.authorizeUrl: https://oidc.example.com
  publicHost: rustdesk.example.com
templates:
  - templates/oidc-mock-deployment.yaml
tests:
  - it: declares runAsNonRoot, as the restricted Pod Security level requires
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: renders pod annotations
    set:
      oidcMock.podAnnotations:
        sidecar.istio.io/inject: "false"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"

  - it: disables the Istio sidecar by default
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"

  - it: lets podAnnotations override the sidecar default
    set:
      oidcMock.podAnnotations:
        sidecar.istio.io/inject: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "true"
