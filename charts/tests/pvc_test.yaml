suite: pvc
templates:
  - templates/pvc.yaml
tests:
  - it: is not rendered when persistence is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when persistence is enabled
    set:
      hbbs.persistence.enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-hbbs-data
      - equal:
          path: spec.resources.requests.storage
          value: 100Mi

  - it: renders standard labels
    set:
      hbbs.persistence.enabled: true
    asserts:
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: respects fullnameOverride
    set:
      hbbs.persistence.enabled: true
      fullnameOverride: myrd
    asserts:
      - equal:
          path: metadata.name
          value: myrd-hbbs-data

  - it: sets storage class when specified
    set:
      hbbs.persistence.enabled: true
      hbbs.persistence.storageClass: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: omits storage class when empty
    set:
      hbbs.persistence.enabled: true
    asserts:
      - isNull:
          path: spec.storageClassName

  - it: sets custom size
    set:
      hbbs.persistence.enabled: true
      hbbs.persistence.size: 1Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
