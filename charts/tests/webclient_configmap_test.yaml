suite: web client nginx config
templates:
  - webclient-configmap.yaml
tests:
  - it: serves the static files on the unprivileged port
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?m)^\s*listen 8080;$'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'root /usr/share/nginx/html;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'add_header Cache-Control "no-cache, must-revalidate";'

  - it: refuses framing by other sites and MIME sniffing
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'add_header X-Frame-Options SAMEORIGIN;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'add_header X-Content-Type-Options nosniff;'

  - it: proxies nothing, the VirtualService routes to the backends
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: '/ws/'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'real_ip'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'worker_connections\s+4096'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'worker_rlimit_nofile|backlog='
