suite: web client nginx config
templates:
  - webclient-configmap.yaml
tests:
  - it: keeps the client's port in the Host sent to the api-server
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_set_header Host \$host;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)location /api/ \{[^}]*proxy_set_header Host \$http_host;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)location /ui \{[^}]*proxy_set_header Host \$http_host;'

  - it: overwrites the client address headers on every backend location
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)location /ws/id \{[^}]*proxy_set_header X-Real-IP \$remote_addr;[^}]*proxy_set_header X-Forwarded-For \$remote_addr;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)location /ws/relay \{[^}]*proxy_set_header X-Real-IP \$remote_addr;[^}]*proxy_set_header X-Forwarded-For \$remote_addr;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)location /api/ \{[^}]*proxy_set_header X-Real-IP \$remote_addr;[^}]*proxy_set_header X-Forwarded-For \$remote_addr;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '(?s)location /ui \{[^}]*proxy_set_header X-Real-IP \$remote_addr;[^}]*proxy_set_header X-Forwarded-For \$remote_addr;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_add_x_forwarded_for'

  - it: trusts no proxy by default
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'set_real_ip_from|real_ip_header'

  - it: resolves the address from trusted proxies
    set:
      realIp:
        header: CF-Connecting-IP
        trustedProxies: ["10.244.0.0/16", "172.18.0.0/16"]
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'set_real_ip_from 10\.244\.0\.0/16;\s+set_real_ip_from 172\.18\.0\.0/16;\s+real_ip_header CF-Connecting-IP;\s+real_ip_recursive on;'
