suite: image pull secrets
templates:
  - templates/apiserver-deployment.yaml
  - templates/hbbs-oauth2-configmap.yaml
  - templates/hbbr-deployment.yaml
  - templates/hbbs-deployment.yaml
  - templates/oidc-mock-deployment.yaml
  - templates/postgresql-statefulset.yaml
  - templates/webclient-deployment.yaml
  - templates/webclient-configmap.yaml
tests:
  - it: apiserver-deployment uses global.imagePullSecrets
    template: templates/apiserver-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      global.imagePullSecrets:
        - name: corp-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: corp-registry

  - it: apiserver-deployment has no pull secrets by default
    template: templates/apiserver-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: hbbr-deployment uses global.imagePullSecrets
    template: templates/hbbr-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      global.imagePullSecrets:
        - name: corp-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: corp-registry

  - it: hbbr-deployment has no pull secrets by default
    template: templates/hbbr-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: hbbs-deployment uses global.imagePullSecrets
    template: templates/hbbs-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      global.imagePullSecrets:
        - name: corp-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: corp-registry

  - it: hbbs-deployment has no pull secrets by default
    template: templates/hbbs-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: oidc-mock-deployment uses global.imagePullSecrets
    template: templates/oidc-mock-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      global.imagePullSecrets:
        - name: corp-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: corp-registry

  - it: oidc-mock-deployment has no pull secrets by default
    template: templates/oidc-mock-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: postgresql-statefulset uses global.imagePullSecrets
    template: templates/postgresql-statefulset.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      global.imagePullSecrets:
        - name: corp-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: corp-registry

  - it: postgresql-statefulset has no pull secrets by default
    template: templates/postgresql-statefulset.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: webclient-deployment uses global.imagePullSecrets
    template: templates/webclient-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      global.imagePullSecrets:
        - name: corp-registry
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: corp-registry

  - it: webclient-deployment has no pull secrets by default
    template: templates/webclient-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: rejects entries without a name
    template: templates/hbbs-deployment.yaml
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      global.imagePullSecrets:
        - corp-registry
    asserts:
      - failedTemplate:
          errorPattern: "imagePullSecrets/0"
