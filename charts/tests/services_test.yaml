suite: services
set:
  oidcMock.authorizeUrl: https://oidc.example.com
  publicHost: rustdesk.example.com
tests:
  - it: renders hbbs service with correct ports
    templates:
      - templates/hbbs-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-hbbs
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - contains:
          path: spec.ports
          content:
            name: ws
            port: 21118
            targetPort: ws
            protocol: TCP
      - lengthEqual:
          path: spec.ports
          count: 1

  - it: renders webclient service with correct port
    templates:
      - templates/webclient-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-webclient
      - contains:
          path: spec.ports
          content:
            name: http
            port: 80
            targetPort: http
            protocol: TCP

  - it: respects fullnameOverride on all services
    templates:
      - templates/hbbs-service.yaml
    set:
      fullnameOverride: myrd
    asserts:
      - equal:
          path: metadata.name
          value: myrd-hbbs

  - it: renders a headless hbbs Service for pod-to-pod forwarding
    templates:
      - templates/hbbs-headless-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-hbbs-hl
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports
          value:
            - name: internal
              port: 21120
              targetPort: internal
              protocol: TCP
