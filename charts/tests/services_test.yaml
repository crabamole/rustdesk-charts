suite: services
tests:
  - it: renders hbbs service with correct ports
    templates:
      - templates/hbbs-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hbbs
      - contains:
          path: spec.ports
          content:
            name: rendezvous
            port: 21116
            targetPort: rendezvous
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: ws
            port: 21118
            targetPort: ws
            protocol: TCP

  - it: renders hbbr service with correct ports
    templates:
      - templates/hbbr-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hbbr
      - contains:
          path: spec.ports
          content:
            name: relay
            port: 21117
            targetPort: relay
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: ws
            port: 21119
            targetPort: ws
            protocol: TCP

  - it: renders webclient service with correct port
    templates:
      - templates/webclient-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-webclient
      - contains:
          path: spec.ports
          content:
            name: http
            port: 80
            targetPort: http
            protocol: TCP
