suite: hbbr deployment
templates:
  - templates/hbbr-deployment.yaml
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-hbbr
      - equal:
          path: spec.replicas
          value: 1

  - it: sets the default image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/rophy/rustdesk-server:1.1.17-20260824-1

  - it: uses global image registry override
    set:
      global.imageRegistry: registry.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/rophy/rustdesk-server:1.1.17-20260824-1

  - it: renders replicas from values
    set:
      hbbr.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: omits env when all values are empty
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env

  - it: renders env when set
    set:
      hbbr.env:
        RUST_LOG: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: debug

  - it: renders default resource limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m

  - it: renders container ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: relay
            containerPort: 21117
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ws
            containerPort: 21119
            protocol: TCP

  - it: sets container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: renders nodeSelector
    set:
      hbbr.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: omits nodeSelector when empty
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector

  - it: renders tolerations
    set:
      hbbr.tolerations:
        - key: dedicated
          operator: Equal
          value: rustdesk
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: rustdesk
            effect: NoSchedule

  - it: renders pod annotations
    set:
      hbbr.podAnnotations:
        test-annotation: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations.test-annotation
          value: "true"

  - it: omits annotations when empty
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  - it: renders pod labels
    set:
      hbbr.podLabels:
        team: infra
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: infra
