suite: webclient deployment
templates:
  - templates/webclient-deployment.yaml
  - templates/webclient-configmap.yaml
tests:
  - it: renders with default values
    template: templates/webclient-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-webclient
      - equal:
          path: spec.replicas
          value: 1

  - it: renders standard labels
    template: templates/webclient-deployment.yaml
    asserts:
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "1.4.9"

  - it: respects fullnameOverride
    template: templates/webclient-deployment.yaml
    set:
      fullnameOverride: myrd
    asserts:
      - equal:
          path: metadata.name
          value: myrd-webclient

  - it: sets the default image
    template: templates/webclient-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/rophy/rustdesk/web-client:1.4.9-20260823-1

  - it: uses global image registry override
    template: templates/webclient-deployment.yaml
    set:
      global.imageRegistry: registry.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/rophy/rustdesk/web-client:1.4.9-20260823-1

  - it: renders env vars when set
    template: templates/webclient-deployment.yaml
    set:
      webclient.env:
        RUSTDESK_HOST: rustdesk.example.com
        RUSTDESK_KEY: abc123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUSTDESK_HOST
            value: rustdesk.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUSTDESK_KEY
            value: abc123

  - it: omits env when all values are empty
    template: templates/webclient-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env

  - it: renders default resource limits
    template: templates/webclient-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 64Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi

  - it: renders container port
    template: templates/webclient-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 80
            protocol: TCP

  - it: sets container security context
    template: templates/webclient-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: renders nodeSelector
    template: templates/webclient-deployment.yaml
    set:
      webclient.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: omits nodeSelector when empty
    template: templates/webclient-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector

  - it: renders tolerations
    template: templates/webclient-deployment.yaml
    set:
      webclient.tolerations:
        - key: dedicated
          operator: Equal
          value: rustdesk
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: rustdesk
            effect: NoSchedule

  - it: renders affinity
    template: templates/webclient-deployment.yaml
    set:
      webclient.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity.podAntiAffinity

  - it: renders pod annotations
    template: templates/webclient-deployment.yaml
    set:
      webclient.podAnnotations:
        test-annotation: "false"
    asserts:
      - equal:
          path: spec.template.metadata.annotations.test-annotation
          value: "false"

  - it: always has nginx config checksum annotation
    template: templates/webclient-deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/nginx-config"]

  - it: renders pod labels
    template: templates/webclient-deployment.yaml
    set:
      webclient.podLabels:
        team: frontend
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: frontend
