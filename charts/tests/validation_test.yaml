suite: validation
set:
  istio.gateway: istio-ingress/corp
  trustedProxies: ["10.244.0.0/16"]
  publicHost: rustdesk.example.com
templates:
  - templates/database-secret.yaml
tests:
  - it: requires an authorize URL while the mock is enabled (the default)
    asserts:
      - failedTemplate:
          errorPattern: "oidcMock.authorizeUrl is required while oidcMock.enabled"

  - it: rejects an enabled mock without an authorize URL next to an IdP Secret
    set:
      hbbs.oauth2.existingSecret: corp-oidc
    asserts:
      - failedTemplate:
          errorPattern: "set oidcMock.enabled: false when using your own IdP"

  - it: accepts the quickstart mock with an authorize URL
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notFailedTemplate: {}

  - it: accepts a corporate IdP Secret with the mock disabled
    set:
      oidcMock.enabled: false
      hbbs.oauth2.existingSecret: corp-oidc
    asserts:
      - notFailedTemplate: {}

  - it: fails with the mock disabled and no Secret
    set:
      oidcMock.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "login is OIDC-only"

  - it: requires publicHost
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      publicHost: ""
    asserts:
      - failedTemplate:
          errorPattern: "publicHost is required"

  - it: rejects the removed hbbs.relayAddress
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      hbbs.relayAddress: rustdesk.example.com:443
    asserts:
      - failedTemplate:
          errorPattern: "hbbs.relayAddress was removed: set publicHost"

  - it: rejects a scheme or path in publicHost
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      publicHost: https://rustdesk.example.com
    asserts:
      - failedTemplate:
          errorPattern: "publicHost"

  - it: rejects more than 32 hbbs pods
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      hbbs.replicas: 33
    asserts:
      - failedTemplate:
          errorPattern: "replicas"

  - it: rejects a hand-set RUSTDESK_KEY
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      webclient.env.RUSTDESK_KEY: abc123
    asserts:
      - failedTemplate:
          errorPattern: "RUSTDESK_KEY is no longer used"

  - it: requires istio.gateway
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      istio.gateway: ""
    asserts:
      - failedTemplate:
          errorPattern: "istio.gateway is required"

  - it: requires trustedProxies
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      trustedProxies: []
    asserts:
      - failedTemplate:
          errorPattern: "trustedProxies is required: .*sets X-Forwarded-For"

  - it: rejects TRUSTED_PROXIES set through a component env
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      hbbs.env.TRUSTED_PROXIES: 10.0.0.0/8
    asserts:
      - failedTemplate:
          errorPattern: "hbbs.env.TRUSTED_PROXIES: set trustedProxies instead"

  - it: rejects the removed ingress value
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "ingress was removed"

  - it: rejects the removed webclient.nginx value
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      webclient.nginx.workerConnections: 100
    asserts:
      - failedTemplate:
          errorPattern: "webclient.nginx was removed"

  - it: rejects the removed realIp value
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      realIp.header: X-Real-IP
    asserts:
      - failedTemplate:
          errorPattern: "realIp was removed"

  - it: accepts IPv4 and IPv6 CIDRs in trustedProxies
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      trustedProxies: ["10.244.0.0/16", "fd00::/8", "192.0.2.7"]
    asserts:
      - notFailedTemplate: {}

  - it: rejects a malformed trustedProxies entry
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      trustedProxies: ["10.0.0.0/8x"]
    asserts:
      - failedTemplate: {}

  - it: rejects a non-address trustedProxies entry
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      trustedProxies: ["not-a-cidr"]
    asserts:
      - failedTemplate: {}
