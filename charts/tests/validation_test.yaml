suite: validation
set:
  publicHost: rustdesk.example.com
templates:
  - templates/database-secret.yaml
tests:
  - it: fails without any OIDC configuration (login is OIDC-only)
    asserts:
      - failedTemplate:
          errorPattern: "login is OIDC-only"

  - it: accepts the quickstart mock with an authorize URL
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
    asserts:
      - notFailedTemplate: {}

  - it: accepts a corporate IdP Secret with the mock disabled
    set:
      oidcMock.enabled: false
      hbbs.oauth2.existingSecret: corp-oidc
    asserts:
      - notFailedTemplate: {}

  - it: fails with the mock disabled and no Secret
    set:
      oidcMock.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "login is OIDC-only"

  - it: requires publicHost
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      publicHost: ""
    asserts:
      - failedTemplate:
          errorPattern: "publicHost is required"

  - it: rejects the removed hbbs.relayAddress
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      hbbs.relayAddress: rustdesk.example.com:443
    asserts:
      - failedTemplate:
          errorPattern: "hbbs.relayAddress was removed: set publicHost"

  - it: rejects a scheme or path in publicHost
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      publicHost: https://rustdesk.example.com
    asserts:
      - failedTemplate:
          errorPattern: "publicHost"

  - it: rejects more than 32 hbbs pods
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      hbbs.replicas: 33
    asserts:
      - failedTemplate:
          errorPattern: "replicas"

  - it: rejects a hand-set RUSTDESK_KEY
    set:
      oidcMock.authorizeUrl: https://oidc.example.com
      webclient.env.RUSTDESK_KEY: abc123
    asserts:
      - failedTemplate:
          errorPattern: "RUSTDESK_KEY is no longer used"
