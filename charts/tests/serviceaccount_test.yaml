suite: service account
templates:
  - templates/serviceaccount.yaml
  - templates/hbbs-deployment.yaml
tests:
  - it: creates a service account without an automounted token
    template: templates/serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: runs pods with it and without a token
    template: templates/hbbs-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-rustdesk
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: can use an existing service account
    set:
      serviceAccount.create: false
      serviceAccount.name: corp-sa
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: corp-sa
        template: templates/hbbs-deployment.yaml
