suite: hbbr statefulset
templates:
  - templates/hbbr-statefulset.yaml
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-hbbr
      - equal:
          path: spec.replicas
          value: 1

  - it: renders standard labels
    asserts:
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "1.4.9"

  - it: respects fullnameOverride
    set:
      fullnameOverride: myrd
    asserts:
      - equal:
          path: metadata.name
          value: myrd-hbbr

  - it: sets the default image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/crabamole/rustdesk-server:1.1.16-3

  - it: uses global image registry override
    set:
      global.imageRegistry: registry.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/crabamole/rustdesk-server:1.1.16-3

  - it: is a StatefulSet governed by the headless Service, replaced one pod at a time
    asserts:
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-rustdesk-hbbr-hl
      - equal:
          path: spec.podManagementPolicy
          value: OrderedReady
      - equal:
          path: spec.updateStrategy
          value:
            type: RollingUpdate

  - it: scales with hbbr.replicas
    set:
      hbbr.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: drains for 30 minutes by default
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 1800

  - it: takes the grace period from values
    set:
      hbbr.terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: tells hbbr its health port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HEALTH_PORT
            value: "21122"

  - it: spreads pods over nodes without blocking scheduling
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hbbr
                  app.kubernetes.io/instance: RELEASE-NAME

  - it: runs as a non-root user with a writable /data home
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].workingDir
          value: /data
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /data

  - it: renders env when set
    set:
      hbbr.env:
        RUST_LOG: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: debug

  - it: renders default resource limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m

  - it: renders container ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ws
            containerPort: 21119
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            containerPort: 21122
            protocol: TCP
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2

  - it: sets container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: renders nodeSelector
    set:
      hbbr.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: omits nodeSelector when empty
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector

  - it: renders tolerations
    set:
      hbbr.tolerations:
        - key: dedicated
          operator: Equal
          value: rustdesk
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: rustdesk
            effect: NoSchedule

  - it: renders pod annotations
    set:
      hbbr.podAnnotations:
        test-annotation: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations.test-annotation
          value: "true"

  - it: omits annotations when empty
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  - it: probes /livez and /readyz on the health port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 2
            failureThreshold: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2

  - it: renders pod labels
    set:
      hbbr.podLabels:
        team: infra
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: infra
