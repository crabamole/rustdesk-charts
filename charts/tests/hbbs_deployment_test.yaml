suite: hbbs deployment
templates:
  - templates/hbbs-deployment.yaml
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-rustdesk-hbbs
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: renders standard labels
    asserts:
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "1.4.9"

  - it: respects fullnameOverride
    set:
      fullnameOverride: myrd
    asserts:
      - equal:
          path: metadata.name
          value: myrd-hbbs

  - it: sets the default image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/rophy/sctgdesk-server:0.1.0

  - it: uses global image registry override
    set:
      global.imageRegistry: registry.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/rophy/sctgdesk-server:0.1.0

  - it: sets relay address args
    set:
      hbbs.relayAddress: relay.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "-r"
      - contains:
          path: spec.template.spec.containers[0].args
          content: relay.example.com

  - it: omits args when relay address is empty
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].args

  - it: renders environment variables
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALWAYS_USE_RELAY
            value: "Y"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: info

  - it: sets HOME to the writable data dir (uid 1000 has no home; HOME=/ is read-only)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /data

  - it: always sets env from the database helper and API_SERVER even when hbbs.env is empty
    set:
      hbbs.env: null
      oidcMock:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_URL
            value: postgres://rustdesk:$(DATABASE_PASSWORD)@RELEASE-NAME-rustdesk-postgresql:5432/rustdesk
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_SERVER
            value: http://RELEASE-NAME-rustdesk-apiserver:21114

  - it: renders default resource limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 32Mi

  - it: renders custom resources
    set:
      hbbs.resources:
        limits:
          cpu: "2"
          memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: renders container ports
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: ws
            containerPort: 21118
            protocol: TCP
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1

  - it: mounts keypair and data volumes
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: keypair
            mountPath: /data/id_ed25519
            subPath: id_ed25519
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: sets container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: "ALL"
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: renders nodeSelector
    set:
      hbbs.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: omits nodeSelector when empty
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector

  - it: renders affinity
    set:
      hbbs.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - us-east-1a
    asserts:
      - isNotNull:
          path: spec.template.spec.affinity.nodeAffinity

  - it: renders tolerations
    set:
      hbbs.tolerations:
        - key: dedicated
          operator: Equal
          value: rustdesk
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: rustdesk
            effect: NoSchedule

  - it: renders pod annotations
    set:
      hbbs.podAnnotations:
        test-annotation: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations.test-annotation
          value: "true"

  - it: omits annotations when empty
    asserts:
      - isNull:
          path: spec.template.metadata.annotations

  - it: renders pod labels
    set:
      hbbs.podLabels:
        team: infra
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: infra

  - it: sets OAUTH2_CONFIG_FILE env when oidcMock is enabled with authorizeUrl
    set:
      oidcMock:
        authorizeUrl: "https://oidc.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH2_CONFIG_FILE
            value: /data/oauth2.toml

  - it: mounts generated oauth2 secret when oidcMock is enabled
    set:
      oidcMock:
        authorizeUrl: "https://oidc.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: oauth2
            mountPath: /data/oauth2.toml
            subPath: oauth2.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth2
            secret:
              secretName: RELEASE-NAME-hbbs-oauth2

  - it: mounts existingSecret when provided
    set:
      hbbs:
        oauth2:
          existingSecret: my-custom-oauth2
      oidcMock:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth2
            secret:
              secretName: my-custom-oauth2

  - it: omits oauth2 volume when oidcMock disabled and no existingSecret
    set:
      oidcMock:
        enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: oauth2
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: oauth2
          any: true

  - it: hbbs container has liveness and readiness probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: ws
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: ws

  - it: has exactly one container and no PVC
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}

  - it: gets DB_URL from the shared database helper and API_SERVER from the service
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_URL
            value: postgres://rustdesk:$(DATABASE_PASSWORD)@RELEASE-NAME-rustdesk-postgresql:5432/rustdesk
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_SERVER
            value: http://RELEASE-NAME-rustdesk-apiserver:21114

  - it: has a TCP startup probe on ws
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            tcpSocket:
              port: ws
            periodSeconds: 5
            failureThreshold: 60
