suite: notes
set:
  publicHost: rustdesk.example.com
  istio.gateway: istio-ingress/corp
  trustedProxies: ["10.244.0.0/16"]
templates:
  - templates/NOTES.txt
tests:
  - it: names the gateway and the public URL clients connect through
    asserts:
      - matchRegexRaw:
          pattern: "istio-ingress/corp"
      - matchRegexRaw:
          pattern: "https://rustdesk.example.com"

  - it: prints the first istio.hosts entry
    set:
      istio.hosts: [rustdesk.internal, other.internal]
    asserts:
      - matchRegexRaw:
          pattern: "https://rustdesk.internal"

  - it: no longer warns about an Ingress
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING"
