nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  # Secrets for pulling from a private registry, e.g. [{name: corp-registry}].
  imagePullSecrets: []

keypair:
  secretName: rustdesk-keypair
  privateKeyKey: id_ed25519
  publicKeyKey: id_ed25519.pub

hbbs:
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk-server
    tag: "1.1.16-3"
    pullPolicy: IfNotPresent
  command: ["hbbs"]
  # Required: public host:port clients reach hbbr through (e.g. rustdesk.example.com:443).
  relayAddress: ""
  env:
    ALWAYS_USE_RELAY: "Y"
    # Only logged-in (OIDC) users may start connections; the api-server validates their session.
    LOGGED_IN_ONLY: "Y"
    RUST_LOG: info
    MAX_DATABASE_CONNECTIONS: "10"
  oauth2:
    # Reference an existing Secret containing an oauth2.toml key.
    # When set, the chart uses this Secret as-is and skips generating one.
    existingSecret: ""
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

hbbr:
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk-server
    tag: "1.1.16-3"
    pullPolicy: IfNotPresent
  command: ["hbbr"]
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  env: {}

webclient:
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk/web-client
    tag: "1.4.9-7"
    pullPolicy: IfNotPresent
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  # RUSTDESK_KEY comes from the keypair Secret; add other env vars here.
  env: {}

# Client address recorded by hbbs, hbbr and the api-server. The web client nginx takes it from
# `header` when the request comes from a trusted proxy, and passes only that to the backends.
realIp:
  header: X-Forwarded-For
  # CIDRs of the proxies in front of the web client nginx. Empty: use the connecting address.
  trustedProxies: []

# Ingress-only NetworkPolicies: each component accepts traffic only from the
# components that call it; the web client (and the OIDC mock) accept any source.
networkPolicy:
  enabled: true

# Service account for all pods. None of them needs the Kubernetes API, so its
# token is not mounted.
serviceAccount:
  create: true
  # Name to use; defaults to the release's full name.
  name: ""

# Optional Ingress for the whole service (one host to the web client, which
# routes /ws/id, /ws/relay, /api and /ui itself). Remote sessions are long-lived
# WebSockets: raise the controller's idle timeouts (see README).
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    # Secret with the certificate; empty means no TLS section (TLS terminated elsewhere).
    secretName: ""

# Extra CA certificates to trust (PEM bundle) for the apiserver's outbound
# HTTPS calls (e.g. OIDC token exchange with a corporate CA).
# Multiple certs can be concatenated.
# Example:
#   extraCACerts: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
extraCACerts: ""

oidcMock:
  enabled: true
  # Browser-reachable base URL of the OIDC mock (used as authorization_url).
  # Required when oidcMock is enabled.
  # Example: "https://oidc.example.com"
  authorizeUrl: ""
  image:
    registry: ghcr.io
    repository: rophy/oidc-mock
    tag: "20260913-34fdbaf"
    pullPolicy: IfNotPresent
  port: 12017
  # Users available in the mock OIDC provider.
  users:
    - sub: alice
      email: alice@example.com
      name: Alice Chen
    - sub: bob
      email: bob@example.com
      name: Bob Smith
  resources:
    limits:
      cpu: 200m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podAnnotations: {}

apiserver:
  port: 21114
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk-api
    tag: "3.3.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    # External URL users open, e.g. https://rustdesk.example.com (no path). Empty: taken
    # from the request's Host / X-Forwarded-* headers. Used for the OIDC callback URL.
    PUBLIC_URL: ""
    OAUTH2_CREATE_USER: "1"
    MAX_DATABASE_CONNECTIONS: "20"
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []


# External database. Used only when postgresql.enabled=false.
database:
  # postgres://user:pass@host:5432/db?sslmode=require
  url: ""
  # Existing Secret holding the full URL (takes precedence over url).
  existingSecret: ""
  existingSecretKey: url

# Bundled single-instance PostgreSQL (convenience default; no HA or backups).
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "17.11-trixie"
    pullPolicy: IfNotPresent
  auth:
    username: rustdesk
    database: rustdesk
    # Empty: generated on first install and kept on upgrade (needs a live
    # cluster; set this or existingSecret when rendering offline, e.g. Argo CD).
    # Must be URL-safe (it is embedded in the connection URL).
    password: ""
    # Existing Secret with key "password"; the chart then creates no password Secret.
    existingSecret: ""
  persistence:
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  podAnnotations: {}
