nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""

keypair:
  secretName: rustdesk-keypair
  privateKeyKey: id_ed25519
  publicKeyKey: id_ed25519.pub

hbbs:
  image:
    registry: ghcr.io
    repository: rophy/sctgdesk-server
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  command: ["hbbs"]
  # Public relay address advertised to clients. Must be externally resolvable.
  # Leave empty to let clients discover relay automatically.
  relayAddress: ""
  env:
    ALWAYS_USE_RELAY: "Y"
    RUST_LOG: info
    MAX_DATABASE_CONNECTIONS: "10"
  oauth2:
    # Reference an existing Secret containing an oauth2.toml key.
    # When set, the chart uses this Secret as-is and skips generating one.
    existingSecret: ""
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

hbbr:
  image:
    registry: ghcr.io
    repository: rophy/sctgdesk-server
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  command: ["hbbr"]
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  env: {}

webclient:
  image:
    registry: ghcr.io
    repository: rophy/rustdesk/web-client
    tag: "1.4.9-20260917-1"
    pullPolicy: IfNotPresent
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  env:
    RUSTDESK_KEY: ""

# Extra CA certificates to trust (PEM bundle) for the apiserver's outbound
# HTTPS calls (e.g. OIDC token exchange with a corporate CA).
# Multiple certs can be concatenated.
# Example:
#   extraCACerts: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
extraCACerts: ""

oidcMock:
  enabled: true
  # Browser-reachable base URL of the OIDC mock (used as authorization_url).
  # Required when oidcMock is enabled.
  # Example: "https://oidc.example.com"
  authorizeUrl: ""
  image:
    registry: ghcr.io
    repository: rophy/oidc-mock
    tag: "20260913-34fdbaf"
    pullPolicy: IfNotPresent
  port: 12017
  # Users available in the mock OIDC provider.
  users:
    - sub: alice
      email: alice@example.com
      name: Alice Chen
    - sub: bob
      email: bob@example.com
      name: Bob Smith
  resources:
    limits:
      cpu: 200m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

apiserver:
  port: 21114
  image:
    registry: ghcr.io
    repository: rophy/sctgdesk-api-server
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    OAUTH2_CREATE_USER: "1"
    MAX_DATABASE_CONNECTIONS: "20"
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []


# External database. Used only when postgresql.enabled=false.
database:
  # postgres://user:pass@host:5432/db?sslmode=require
  url: ""
  # Existing Secret holding the full URL (takes precedence over url).
  existingSecret: ""
  existingSecretKey: url

# Bundled single-instance PostgreSQL (convenience default; no HA or backups).
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    username: rustdesk
    database: rustdesk
    # Empty: generated on first install and kept on upgrade (needs a live
    # cluster; set this or existingSecret when rendering offline, e.g. Argo CD).
    # Must be URL-safe (it is embedded in the connection URL).
    password: ""
    # Existing Secret with key "password"; the chart then creates no password Secret.
    existingSecret: ""
  persistence:
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
