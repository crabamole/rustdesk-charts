nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""

keypair:
  secretName: rustdesk-keypair
  privateKeyKey: id_ed25519
  publicKeyKey: id_ed25519.pub

hbbs:
  image:
    registry: ghcr.io
    repository: rophy/sctgdesk-server
    tag: "dev"
    pullPolicy: IfNotPresent
  command: ["hbbs"]
  # Public relay address advertised to clients. Must be externally resolvable.
  # Leave empty to let clients discover relay automatically.
  relayAddress: ""
  # Database URL for hbbs (DB_URL env var). Supports sqlite:// and postgres://.
  # When empty, uses the default SQLite file in /data.
  databaseUrl: ""
  # Reference an existing secret for DB_URL (key: DB_URL).
  # Takes precedence over databaseUrl when set.
  databaseUrlSecretName: ""
  env:
    ALWAYS_USE_RELAY: "Y"
    RUST_LOG: info
  oauth2: ""
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  persistence:
    enabled: false
    size: 100Mi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

hbbr:
  image:
    registry: ghcr.io
    repository: rophy/sctgdesk-server
    tag: "dev"
    pullPolicy: IfNotPresent
  command: ["hbbr"]
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  env: {}

webclient:
  image:
    registry: ghcr.io
    repository: rophy/rustdesk/web-client
    tag: "1.4.9-dev"
    pullPolicy: IfNotPresent
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  env:
    RUSTDESK_KEY: ""

apiserver:
  enabled: false
  port: 21114
  image:
    registry: ""
    repository: sctgdesk-api-server
    tag: "dev"
    pullPolicy: IfNotPresent
  # Database URL for api-server (DATABASE_URL env var). Supports sqlite:// and postgres://.
  # When empty, uses the default SQLite file in /data.
  databaseUrl: ""
  # Reference an existing secret for DATABASE_URL (key: DATABASE_URL).
  # Takes precedence over databaseUrl when set.
  databaseUrlSecretName: ""
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    OAUTH2_CREATE_USER: "1"

