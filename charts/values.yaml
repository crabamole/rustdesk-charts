nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  # Secrets for pulling from a private registry, e.g. [{name: corp-registry}].
  imagePullSecrets: []

# Required: public host[:port] clients reach the web client through (e.g. rustdesk.example.com).
# hbbs hands out wss://<publicHost>/ws/relay/<n>, one URL per hbbr pod
# (ws:// when apiserver.env.PUBLIC_URL starts with http://).
publicHost: ""

keypair:
  secretName: rustdesk-keypair
  privateKeyKey: id_ed25519
  publicKeyKey: id_ed25519.pub

hbbs:
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk-server
    tag: "1.1.16-6"
    pullPolicy: IfNotPresent
  command: ["hbbs"]
  # Devices spread over the pods; at most 32 (the pod ordinal travels in 5 bits).
  replicas: 1
  # Client reconnect throttle is 18 s; moved devices must outlive it before the next pod restarts.
  minReadySeconds: 20
  env:
    ALWAYS_USE_RELAY: "Y"
    # Only logged-in (OIDC) users may start connections; the api-server validates their session.
    LOGGED_IN_ONLY: "Y"
    RUST_LOG: info
    MAX_DATABASE_CONNECTIONS: "10"
  oauth2:
    # Reference an existing Secret containing an oauth2.toml key.
    # When set, the chart uses this Secret as-is and skips generating one.
    existingSecret: ""
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

hbbr:
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk-server
    tag: "1.1.16-6"
    pullPolicy: IfNotPresent
  command: ["hbbr"]
  # One public URL per pod (wss://<publicHost>/ws/relay/<n>); hbbs picks a ready one.
  replicas: 1
  # A stopping pod keeps relaying running sessions until they end or this runs out.
  terminationGracePeriodSeconds: 1800
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  env: {}

webclient:
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk/web-client
    tag: "1.5.0-4"
    pullPolicy: IfNotPresent
  replicas: 1
  # Serves static files only; nothing to drain.
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    limits:
      cpu: "1"
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  # RUSTDESK_KEY comes from the keypair Secret; add other env vars here.
  env: {}

# Clients reach hbbs, hbbr, the api-server and the web client through this Istio Gateway
# (owned by the platform; the chart renders only a VirtualService).
istio:
  # Required: <namespace>/<name> of the Gateway.
  gateway: ""
  # Hosts the VirtualService matches; empty means [publicHost]. Set when a proxy in front rewrites Host.
  hosts: []
  # Set on every request, e.g. x-forwarded-proto: https behind a plain-HTTP gateway listener.
  requestHeaders: {}
  # The gateway's pods, admitted by the NetworkPolicies.
  gatewayPods:
    namespace: istio-system
    labels:
      istio: ingressgateway

# Required: CIDRs of the gateway pods, plus any proxy that appends to or overwrites X-Forwarded-For.
# Never list an L4 hop or a client network; keep it as narrow as the gateway pods' range.
trustedProxies: []

deviceAdmission:
  # true: a device that registers is pending until it is admitted; only admitted devices can be
  # controlled. Devices registered before stay admitted.
  enabled: false
  webhook:
    # Asked to admit or reject pending devices (rustdesk-api docs/admission-webhook.md). Empty: off.
    url: ""
    # Secret with id_ed25519 / id_ed25519.pub from `rustdesk-api admission keygen`.
    keySecret: ""

# Ingress-only NetworkPolicies: each component accepts traffic only from the
# components that call it; the web client accepts the gateway pods, the OIDC mock any source.
networkPolicy:
  enabled: true

# Service account for all pods. None of them needs the Kubernetes API, so its
# token is not mounted.
serviceAccount:
  create: true
  # Name to use; defaults to the release's full name.
  name: ""

# Extra CA certificates to trust (PEM bundle) for the apiserver's outbound
# HTTPS calls (e.g. OIDC token exchange with a corporate CA).
# Multiple certs can be concatenated.
# Example:
#   extraCACerts: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
extraCACerts: ""

oidcMock:
  enabled: true
  # Browser-reachable base URL of the OIDC mock (used as authorization_url).
  # Required when oidcMock is enabled.
  # Example: "https://oidc.example.com"
  authorizeUrl: ""
  # Hosts its VirtualService matches; empty means the host of authorizeUrl. Set when a proxy in front rewrites Host.
  hosts: []
  image:
    registry: ghcr.io
    repository: rophy/oidc-mock
    tag: "20260913-34fdbaf"
    pullPolicy: IfNotPresent
  port: 12017
  # Users available in the mock OIDC provider.
  users:
    - sub: alice
      email: alice@example.com
      name: Alice Chen
    - sub: bob
      email: bob@example.com
      name: Bob Smith
  resources:
    limits:
      cpu: 200m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
  podAnnotations: {}

apiserver:
  port: 21114
  replicas: 1
  image:
    registry: ghcr.io
    repository: crabamole/rustdesk-api
    tag: "3.8.1"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  env:
    # The origin users open (no path), for OIDC callback URLs. Empty: https://<publicHost>;
    # set http://... for a plain-HTTP setup (relay URLs then use ws://).
    PUBLIC_URL: ""
    OAUTH2_CREATE_USER: "1"
    # Y: a user logged in to cRustDesk on a device opens it without its password
    # (devices need wss:// to hbbs with a valid certificate). Off when empty.
    SAME_USER_ACCESS: ""
    MAX_DATABASE_CONNECTIONS: "20"
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []


# External database. Used only when postgresql.enabled=false.
database:
  # postgres://user:pass@host:5432/db?sslmode=require
  url: ""
  # Existing Secret holding the full URL (takes precedence over url).
  existingSecret: ""
  existingSecretKey: url

# Bundled single-instance PostgreSQL (convenience default; no HA or backups).
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "17.11-trixie"
    pullPolicy: IfNotPresent
  auth:
    username: rustdesk
    database: rustdesk
    # Empty: generated on first install and kept on upgrade (needs a live
    # cluster; set this or existingSecret when rendering offline, e.g. Argo CD).
    # Must be URL-safe (it is embedded in the connection URL).
    password: ""
    # Existing Secret with key "password"; the chart then creates no password Secret.
    existingSecret: ""
  persistence:
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  podAnnotations: {}
