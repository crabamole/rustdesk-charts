global:
  imageRegistry: ""

keypair:
  secretName: rustdesk-keypair
  privateKeyKey: id_ed25519
  publicKeyKey: id_ed25519.pub

hbbs:
  image:
    registry: ghcr.io
    repository: rophy/rustdesk-server
    tag: "1.1.17-20260824-1"
    pullPolicy: IfNotPresent
  command: ["hbbs"]
  # Public relay address advertised to clients. Must be externally resolvable.
  # Leave empty to let clients discover relay automatically.
  relayAddress: ""
  env:
    ALWAYS_USE_RELAY: "Y"
    RUST_LOG: info
  persistence:
    enabled: false
    size: 100Mi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

hbbr:
  image:
    registry: ghcr.io
    repository: rophy/rustdesk-server
    tag: "1.1.17-20260824-1"
    pullPolicy: IfNotPresent
  command: ["hbbr"]
  replicas: 1
  env: {}

webclient:
  image:
    registry: ghcr.io
    repository: rophy/rustdesk/web-client
    tag: "1.4.9-20260823-1"
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    RUSTDESK_HOST: ""
    RUSTDESK_RELAY: ""
    RUSTDESK_KEY: ""
    RUSTDESK_API: ""

istio:
  enabled: false
  gateway: istio-system/default-gateway
  host: rustdesk.example.com
